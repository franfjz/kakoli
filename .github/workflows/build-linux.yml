name: Build Linux

# Compila el ejecutable de Linux con Nuitka en un runner de GitHub (Ubuntu) y lo
# publica. Se ejecuta al empujar un tag «vX.Y.Z» (adjunta el binario a la Release de
# ese tag) o manualmente desde la pestaña Actions (deja el binario como artefacto).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # necesario para adjuntar el binario a la Release

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Dependencias del sistema (Tk, compilador, patchelf)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-tk tk-dev patchelf ccache

      - name: Entorno virtual + Nuitka + tkinterdnd2
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install nuitka tkinterdnd2   # tkinterdnd2 = arrastrar y soltar

      - name: Comprobar que Tkinter funciona
        run: |
          . .venv/bin/activate
          python -c "import tkinter; print('tkinter', tkinter.TkVersion)"

      - name: Compilar con Nuitka (onefile)
        run: |
          . .venv/bin/activate
          python -m nuitka \
            --onefile \
            --assume-yes-for-downloads \
            --enable-plugin=tk-inter \
            --include-package=core \
            --include-package=gui \
            --include-package=tasks \
            --include-package=tkinterdnd2 \
            --include-package-data=tkinterdnd2 \
            --include-data-dir=fuentes=fuentes \
            --include-data-dir=iconos=iconos \
            --linux-icon=iconos/icono_piramide_jungla_256.png \
            --lto=yes \
            --output-dir=dist \
            --output-filename=kakoli \
            kakoli.py

      - name: Verificar la salida
        run: |
          ls -la dist
          test -f dist/kakoli
          cp dist/kakoli kakoli-linux-x86_64

      - name: Subir como artefacto (siempre)
        uses: actions/upload-artifact@v4
        with:
          name: kakoli-linux-x86_64
          path: kakoli-linux-x86_64
          if-no-files-found: error

      - name: Adjuntar a la Release del tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" kakoli-linux-x86_64 \
              --title "$GITHUB_REF_NAME" --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" kakoli-linux-x86_64 --clobber
