[pytest]
# Raíz de descubrimiento de tests. La suite se organiza por área (core/gui/tasks),
# reflejando la arquitectura objetivo de docs/REESTRUCTURACION.md.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Marcadores: permiten aislar lo que necesita entorno gráfico o es lento.
#   -m "not gui"    -> salta los tests que abren una ventana Tkinter
#   -m "not lento"  -> salta los tests de round-trip largos
markers =
    gui: requiere Tkinter (una ventana real); se salta si no hay display.
    lento: test de larga duración (round-trip sobre árboles grandes).

# import-mode=importlib: permite que varias tareas tengan un test con el mismo
# nombre de archivo (p. ej. cada tasks/<t>/ con su test_cli.py) sin __init__.py.
addopts = -ra --import-mode=importlib
